<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New playlist - uTunes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead"><div class="inner">
    <a class="wordmark" href="/home">uTunes</a>
    <nav>
      <a href="/home">Songs</a>
      <a href="/likedsongs">Liked</a>
      <a href="/playlists">Playlists</a>
      <a href="/login">Log out</a>
    </nav>
  </div></header>
  <main>
    <div class="form-card">
      <h1>New playlist</h1>
      <form action="/createplaylist" method="post">
        <input name="name" type="text" placeholder="Playlist name" required>
        <select name="publicorprivate">
          <option value="private">Private</option>
          <option value="public">Public</option>
        </select>
        <input type="submit" value="Create">
      </form>
      <p class="alt"><a href="/playlists">Back to your playlists</a></p>
    </div>
  </main>
</body>
</html>
