<h2>Filter</h2>
<form action="/filter?type=year" method="post">
  <label for="minyear">Year</label>
  <input type="number" id="minyear" name="minyear" min="1200" max="5000" placeholder="from">
  <input type="number" id="maxyear" name="maxyear" min="1200" max="5000" placeholder="to">
  <input type="submit" value="Apply">
</form>

<form action="/filter?type=like" method="post">
  <label for="minlike">Likes</label>
  <input type="number" id="minlike" name="minlike" min="0" max="5000" placeholder="from">
  <input type="number" id="maxlike" name="maxlike" min="0" max="5000" placeholder="to">
  <input type="submit" value="Apply">
</form>

<form action="/filter?type=artist" method="post">
  <label for="artistname">Artist</label>
  <input name="artistname" id="artistname" type="text" placeholder="Artist name">
  <input type="submit" value="Apply">
</form>

<form action="/filter?type=delete" method="post">
  <label for="deletefilters">Clear all filters</label>
  <select name="deletefilters" id="deletefilters">
    <option value="deletefilters">Yes</option>
  </select>
  <input type="submit" value="Clear">
</form>
